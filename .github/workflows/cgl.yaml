name: CGL
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  cgl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: none

      # Validation
      - name: Validate composer.json
        run: composer validate --no-check-lock

      # Install dependencies
      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # Analyze
      - name: Analyze dependencies
        run: composer cgl analyze:dependencies

      # Linting
      - name: Lint composer.json
        run: composer cgl lint:composer

      - name: Lint .editorconfig
        run: composer cgl lint:editorconfig

      - name: Lint PHP
        run: composer cgl lint:php

      # Two XLIFF files live here, so the full validation action EXT:monitoring
      # ships would be more plumbing than the check itself.
      - name: Lint XLIFF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y libxml2-utils
          find Resources -name '*.xlf' -print0 | xargs -0 -r xmllint --noout

      # SCA
      - name: SCA PHP
        run: composer cgl sca:php -- --error-format github

      - name: Migration
        run: composer cgl sca:migrate:php --dry-run
